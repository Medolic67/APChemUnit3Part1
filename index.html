<script>
function switchUnit(v){window.location.href=v+".html"}

const KEY="cm_unit3_missed";
const C={
  I:"3.1 Intra vs. Intermolecular",
  F:"3.1 Types of IMFs",
  S:"3.1 IMF Strength & Properties",
  T:"3.2 Types of Solids",
  M:"3.3 States of Matter",
  G:"3.4 Gas Variables & Laws",
  D:"3.4 Dalton's Law",
  K:"3.5 Kinetic Molecular Theory",
  N:"3.6 Real Gases",
  L:"Labs & Lab Math",
  X:"3.7–3.13 Preview"
};

/* [term, category, definition, 1 = beyond your handouts] */
const D=[
["Intramolecular force","I","An attraction <i>within</i> a compound that holds atoms together: a covalent, ionic, or metallic bond. Breaking one is a chemical change."],
["Intermolecular force (IMF)","I","An attraction <i>between</i> separate molecules. Overcoming IMFs (melting, boiling) is a physical change, and the molecules stay intact."],
["Coulomb's law","I","F ∝ q₁q₂/r². Force grows with charge magnitude and shrinks with distance. It explains why bonds (full charges, short distance) beat IMFs (partial charges, longer distance)."],
["Bonds vs. IMFs energy example","I","Vaporizing 1 mol of water takes about 41 kJ (breaking IMFs). Breaking all the O–H bonds in 1 mol of water takes about 938 kJ."],
["Solid vs. dashed lines","I","In particulate drawings, bonds are drawn as solid lines and IMFs (like hydrogen bonds) as dashed or dotted lines between molecules."],
["Ionic bond","I","Electrostatic attraction between cations and anions, typically a metal plus a nonmetal (e.g., NaCl, LiCl)."],
["Metallic bond","I","Attraction between metal cations and a delocalized “sea” of valence electrons. Found in pure metals and alloys (e.g., Hg, Cu, brass)."],
["Covalent bond","I","A shared pair of electrons between two nonmetal atoms. Inside molecular substances, or extended in a network solid."],
["Dipole","F","A molecule (or bond) with a partially positive end (δ⁺) and a partially negative end (δ⁻) caused by unequal sharing of electrons."],
["Partial charges (δ⁺, δ⁻)","F","Symbols showing which end of a polar bond or molecule is electron-poor (δ⁺) or electron-rich (δ⁻). The more electronegative atom gets δ⁻."],
["Polar molecule","F","A molecule with a net dipole: polar bonds arranged asymmetrically (often lone pairs on the central atom), e.g., H₂O, NH₃, CH₃Cl, SF₄."],
["Nonpolar molecule","F","A molecule with no net dipole: equal sharing or symmetric geometry that cancels bond dipoles, e.g., CO₂, CH₄, BF₃, CCl₄, I₂."],
["London dispersion forces (LDF)","F","Attractions between temporary, fluctuating dipoles caused by momentary uneven electron distribution. Present in ALL molecules and atoms. The only IMF in nonpolar molecules and noble gases."],
["Temporary (instantaneous) dipole","F","A momentary dipole that forms when electrons happen to bunch up on one side of an atom or molecule. It can induce a dipole in a neighbor."],
["Induced dipole","F","A dipole created in a neighboring particle when a nearby charge or dipole distorts its electron cloud."],
["Dipole–dipole force","F","Attraction between the δ⁺ end of one polar molecule and the δ⁻ end of another. Acts in addition to LDF, so polar molecules usually beat nonpolar ones of similar size."],
["Hydrogen bonding","F","An especially strong dipole–dipole attraction between an H covalently bonded to F, O, or N and a lone pair on an F, O, or N of another molecule (or another part of the same molecule)."],
["FON rule","F","Hydrogen bonding requires H bonded <i>directly</i> to F, O, or N. CH₂F₂ has F but its H atoms are on C, so it can't H-bond with itself."],
["Ion–dipole force","F","Attraction between an ion and a polar molecule, like Na⁺ surrounded by the δ⁻ oxygen ends of water. Usually stronger than dipole–dipole."],
["Dipole–induced dipole force","F","Attraction between a polar molecule and a nonpolar molecule whose electron cloud the dipole distorts. Grows with the dipole's size and the nonpolar molecule's polarizability.",1],
["Van der Waals forces","F","An umbrella term for weak IMFs (LDF, dipole–dipole, dipole–induced dipole). The AP course says not to use it as a synonym for LDF.",1],
["Polarizability","S","How easily an electron cloud can be distorted. It increases with more electrons, a larger electron cloud, and pi bonding. More polarizable → stronger LDF."],
["Contact (surface) area","S","How much of two molecules can touch. Long, straight chains have more contact area than compact, branched isomers, so stronger LDF (n-pentane boils at 309 K, 2-methylbutane at 301 K)."],
["Dipole moment","S","A measure of how polar a molecule is. Larger dipole moment (bigger electronegativity difference) → stronger dipole–dipole forces (H–Cl beats H–Br)."],
["Boiling point","S","Temperature where vapor pressure equals the surrounding pressure. Stronger IMFs → more energy needed to separate molecules → higher boiling point."],
["Vapor pressure","S","Pressure of the vapor above a liquid at equilibrium. Stronger IMFs → fewer molecules escape → LOWER vapor pressure. Inverse of boiling point trends."],
["Volatility","S","How easily a substance evaporates. Weak IMFs → high volatility (e.g., C₆H₁₄ evaporates faster than C₈H₁₇OH)."],
["Melting point","S","Correlates with IMF/bond strength, but less cleanly than boiling point, because melting only rearranges interactions and depends on how particles pack."],
["Like dissolves like","S","Substances with similar IMFs mix. Polar/ionic dissolve in polar solvents (water). Nonpolar dissolve in nonpolar solvents (CCl₄, hexane). Alcohols dissolve both polar and nonpolar molecules."],
["Miscible","S","Two liquids that mix in all proportions because their IMFs are similar (e.g., water and ethanol).",1],
["Hydration (ion orientation)","S","Water molecules surround dissolved ions: the δ⁻ O faces cations (Na⁺) and the δ⁺ H atoms face anions (F⁻, Cl⁻)."],
["Charge density","S","Ion charge relative to size. Higher charge and smaller radius → stronger ion–dipole attraction (Mg²⁺ > Ca²⁺ > Na⁺ > K⁺ with water).",1],
["Enthalpy of fusion","S","Energy needed to melt one mole of a solid. Larger values signal stronger attractive forces."],
["Enthalpy of vaporization","S","Energy needed to vaporize one mole of a liquid (≈41 kJ/mol for water). Reflects IMF strength.",1],
["Surface tension","S","The resistance of a liquid's surface to stretching, due to IMFs pulling surface molecules inward. Water's is high from hydrogen bonding.",1],
["Viscosity","S","Resistance to flow. Stronger IMFs and long tangling molecules → more viscous (e.g., glycerol, honey).",1],
["Noncovalent interactions in biomolecules","S","IMFs (H-bonds, LDF, dipole forces) between parts of large molecules like proteins and DNA set their shape and function."],
["Ionic solid","T","Lattice of cations and anions held by ionic bonds. High MP, hard and brittle, does not conduct as a solid but conducts when molten or dissolved. Often water soluble. Ex: NaCl, MgO, Na₂SO₄."],
["Metallic solid","T","Metal cations in a sea of delocalized electrons. Conducts heat and electricity as a solid, malleable, ductile, lustrous, wide MP range. Ex: Cu, Al, Rh."],
["Covalent network solid","T","Atoms covalently bonded in a continuous 3-D (or layered 2-D) network, no discrete molecules. Very high MP, hard, insoluble, usually nonconducting. Ex: diamond, SiO₂, SiC, BN."],
["Molecular solid","T","Discrete molecules held by IMFs only. Low MP, soft, nonconducting (electrons are localized in bonds and lone pairs). Ex: ice, I₂, dry ice (CO₂), naphthalene."],
["Network solid elements","T","Network solids form only from nonmetals: elemental C (diamond, graphite) and Si, or binary nonmetal compounds such as SiO₂, SiC, BN."],
["Diamond","T","3-D carbon network where each C bonds to four others. Fixed bond angles make it rigid and extremely hard."],
["Graphite","T","Layers of 2-D carbon networks. Layers slide past each other (soft, slippery), and delocalized pi electrons let it conduct within layers."],
["Brittleness of ionic solids","T","When one layer shifts, like charges line up and repel, so the crystal shatters instead of bending."],
["Malleability & ductility","T","Metals can be hammered into sheets or drawn into wire because cations shift without breaking the electron sea."],
["Electron sea model","T","Model of metallic bonding: valence electrons are delocalized across the whole solid. Explains conductivity and malleability. Conduction is electron flow, not atoms moving."],
["Alloy","T","A mixture of metals (or metal plus another element) that keeps a sea of electrons, so it still conducts. Ex: brass (Cu₃Zn₂), steel."],
["Substitutional alloy","T","Atoms of similar size replace host atoms in the lattice (e.g., Zn in Cu for brass). Stays fairly malleable.",1],
["Interstitial alloy","T","Small atoms (like C in Fe for steel) fill the gaps between host atoms. Makes the lattice more rigid: less malleable and ductile."],
["Lattice","T","The regular, repeating 3-D arrangement of particles in a crystalline solid."],
["Formula unit","T","The simplest ratio of ions in an ionic lattice (NaCl). There is no discrete “NaCl molecule.”"],
["Melting (physical change)","T","Melting overcomes the weakest attractions in the solid but leaves the chemical formula unchanged: H₂O(s) → H₂O(l)."],
["Conductivity test","T","The key evidence for ionic vs. molecular: an ionic compound's aqueous solution or melt conducts because ions are mobile. Testing the solid alone doesn't distinguish them."],
["Sublimation","T","Solid turning directly into gas, such as dry ice (CO₂) at −78.5 °C at 1 atm, or I₂ releasing purple vapor. Overcomes IMFs, not covalent bonds."],
["Crystalline solid","M","Particles arranged in a regular, repeating 3-D pattern. Sharp melting point. Ex: NaCl, quartz, ice."],
["Amorphous solid","M","Particles with no long-range order, like glass or many plastics. Softens over a range of temperatures."],
["Solid (particle view)","M","Particles in fixed positions, vibrating in place with no overall translation. Definite shape and volume."],
["Liquid (particle view)","M","Particles in close contact but constantly moving past and colliding with each other. Definite volume, no definite shape."],
["Gas (particle view)","M","Particles far apart in constant random motion with minimal IMFs. No definite shape or volume. Collision frequency depends on T, P, and V."],
["Similar molar volume (s vs l)","M","A substance's solid and liquid occupy nearly the same volume per mole because particles are in close contact in both phases."],
["Pressure (P)","G","Force per area from gas particles hitting container walls. Units: atm, mmHg, torr, kPa. 1 atm = 760 mmHg = 760 torr = 101.3 kPa."],
["Volume (V)","G","Space the gas occupies, which equals the container's volume. Use liters with PV = nRT. 1 L = 1000 mL; 1 mL = 1 cm³."],
["Temperature (T)","G","Must be in kelvins for every gas calculation. K = °C + 273.15. Kelvin is proportional to average kinetic energy."],
["Amount (n)","G","Moles of gas. n = mass ÷ molar mass. 1 mol = 6.022 × 10²³ particles."],
["Absolute zero","G","0 K (−273.15 °C), the theoretical temperature where particle motion stops. No negative Kelvin values, so gas laws stay proportional."],
["Barometer","G","Inverted mercury tube (Torricelli) used to measure atmospheric pressure, giving the unit mmHg, also called torr."],
["STP","G","Standard temperature and pressure: 273.15 K (0 °C) and 1 atm. One mole of any ideal gas occupies 22.4 L at STP."],
["Rigid container","G","A container whose volume cannot change. Volume is constant in the calculation."],
["Ideal gas law","G","PV = nRT. Use it when conditions are NOT changing (one set of values). R = 0.08206 L·atm/(mol·K) or 8.314 L·kPa/(mol·K)."],
["Gas constant (R)","G","0.08206 L·atm/(mol·K) or 8.314 L·kPa/(mol·K). Pick the R whose pressure unit matches your pressure."],
["Combined gas law","G","P₁V₁/(n₁T₁) = P₂V₂/(n₂T₂). Use when conditions change. Cancel any variable held constant. On the AP reference sheet."],
["Boyle's law","G","P₁V₁ = P₂V₂ at constant n and T. Pressure and volume are inversely proportional (marshmallow in a syringe)."],
["Charles's law","G","V₁/T₁ = V₂/T₂ at constant n and P. Volume and Kelvin temperature are directly proportional (balloon on a heated flask)."],
["Gay-Lussac's law","G","P₁/T₁ = P₂/T₂ at constant n and V. Pressure and Kelvin temperature are directly proportional (can crush)."],
["Avogadro's law","G","V₁/n₁ = V₂/n₂ at constant P and T. Volume and moles are directly proportional. Equal volumes of gases at the same T and P hold equal numbers of particles."],
["Molar volume","G","Volume of one mole of gas: 22.4 L/mol at STP for any ideal gas, regardless of identity."],
["Molar mass form of ideal gas law","G","PV = (m/M)RT, so M = mRT/(PV). Used to identify an unknown gas from its mass."],
["Gas density formula","G","M = DRT/P, or D = PM/(RT). At the same T and P, the heavier gas is denser. Not on the reference sheet directly."],
["Directly proportional","G","Both variables rise and fall together at the same rate; graph is a straight line with positive slope (V vs. T, P vs. T, V vs. n)."],
["Inversely proportional","G","One rises as the other falls; graph is a curve with negative slope (P vs. V)."],
["Dalton's law of partial pressures","D","P_total = P_A + P_B + P_C + …. Each gas in a mixture exerts its own pressure, independent of the others."],
["Partial pressure","D","The pressure one gas in a mixture would exert if it were alone in the container. P_A = X_A · P_total."],
["Mole fraction (X)","D","X_A = moles of A ÷ total moles. Unitless; all mole fractions in a mixture sum to 1."],
["Equal masses trap","D","Equal masses of different gases do NOT mean equal partial pressures. The lighter gas has more moles, so more pressure. It depends on molar masses."],
["Collecting gas over water","D","Gas collected by water displacement is mixed with water vapor. P_gas = P_total (barometric) − P_H₂O (from a vapor-pressure table, depends only on T)."],
["Kinetic molecular theory (KMT)","K","Five postulates explaining ideal gas behavior at the particle level: random motion, mostly empty space, pressure from wall collisions, no IMFs and elastic collisions, KE ∝ T."],
["KMT postulate 1: random motion","K","Gas particles are in constant, random, straight-line motion and collide with each other and the container."],
["KMT postulate 2: negligible volume","K","Particles are tiny and far apart, so the gas is mostly empty space. Explains why gases compress easily."],
["KMT postulate 3: pressure","K","Pressure comes from particles colliding with container walls. More frequent or more forceful collisions → higher pressure."],
["KMT postulate 4: no attractions","K","Ideal gas particles have no IMFs, and collisions are elastic (no net kinetic energy lost)."],
["KMT postulate 5: KE ∝ T","K","Average kinetic energy is proportional to Kelvin temperature. Gases at the same T have the same average KE regardless of identity."],
["Elastic collision","K","A collision where total kinetic energy is conserved. Ideal gas particles don't slow down overall from colliding."],
["Kinetic energy","K","KE = ½mv². At the same KE (same T), lighter particles (smaller m) must move faster (larger v)."],
["Maxwell–Boltzmann distribution","K","Graph of the number of particles vs. speed (or energy) at a given T. Shows a spread of speeds, not one speed."],
["Effect of temperature on M–B curve","K","Higher T → curve shifts right, peak gets lower and broader (more particles moving faster). Area stays the same (same number of particles)."],
["Effect of molar mass on M–B curve","K","At the same T, a heavier gas has a taller, narrower curve at lower speeds. A lighter gas (H₂, He) has a flatter curve shifted to higher speeds."],
["Most probable speed","K","The speed at the peak of the M–B curve. Increases with T and decreases with molar mass (∝ √(T/M)).",1],
["Effusion / Graham's law","K","Lighter gases escape through tiny holes faster: rate₁/rate₂ = √(M₂/M₁). No longer a required AP calculation.",1],
["Ideal gas","N","A hypothetical gas that follows KMT exactly: no particle volume and no attractions. Real gases come close at high T and low P."],
["Real (non-ideal) gas","N","A gas that deviates from PV = nRT, mostly at HIGH pressure and LOW temperature (conditions near condensation)."],
["Deviation from attractions","N","When particles are slow and close, IMFs pull them together. They hit the walls less often and less hard, so real P (and V) is LOWER than ideal."],
["Deviation from particle volume","N","At very high pressure, particle volume is no longer negligible. Less free space, so real V (or P) is HIGHER than predicted."],
["Which gas deviates more?","N","The one with stronger IMFs (polar, H-bonding, or many electrons) or larger particles. NO₂ (polar) deviates more than CO₂ (nonpolar) of similar mass."],
["Van der Waals equation","N","[P + a(n/V)²](V − nb) = nRT. 'a' corrects for attractions; 'b' corrects for particle volume. Not tested, but explains both deviations.",1],
["Eudiometer","L","A graduated gas-collection tube used upside down in water to collect gas by water displacement (Cage of Death lab)."],
["Water displacement","L","Collecting a gas by letting it push water out of an inverted tube. The collected gas contains water vapor."],
["Equalizing water levels","L","Raise or lower the eudiometer so the water inside matches the outside level. Then the gas pressure inside equals barometric pressure."],
["Vapor pressure of water","L","Depends only on temperature (≈19.8 mmHg at 22 °C, 23.8 mmHg at 25 °C). Subtract it from barometric pressure to get the dry gas pressure."],
["Molar volume experiment","L","Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g). Measure H₂ volume, correct P with Dalton and V to STP with the combined gas law, then divide by moles."],
["Limiting reactant in Cage of Death","L","Mg is limiting (HCl in excess), so moles of H₂ = moles of Mg. Theoretical mass from ribbon length: 1 m of Mg ≈ 0.921 g."],
["Percent error","L","|experimental − theoretical| ÷ theoretical × 100%."],
["Molar mass by gas density lab","L","Weigh a flask with air, then with unknown gas at the same T and P. Mass of gas ÷ moles (from PV = nRT) gives molar mass."],
["Solution","X","A homogeneous mixture: properties are the same throughout. Can be solid, liquid, or gas.",1],
["Heterogeneous mixture","X","A mixture whose properties vary from place to place.",1],
["Molarity (M)","X","Moles of solute ÷ liters of solution. The most common lab concentration unit.",1],
["Chromatography","X","Separates components by differences in IMF attraction to a mobile phase vs. a stationary phase (paper, thin-layer, column).",1],
["Distillation","X","Separates liquids by differences in IMFs and vapor pressure: the more volatile component boils off first.",1],
["Spectroscopy regions","X","Microwave → rotational transitions; infrared → vibrational transitions; UV/visible → electronic transitions.",1],
["Photon energy","X","E = hν and c = λν. Shorter wavelength → higher frequency → more energy.",1],
["Beer–Lambert law","X","A = εbc. Absorbance is proportional to concentration when path length and wavelength are fixed.",1]
];

const NOTES=[
{id:"n31a",code:"3.1 · INTRA VS. INTER",t:"Bonds vs. Intermolecular Forces",h:`
<p><b>Intra</b>molecular forces act <i>inside</i> a substance and hold atoms together (bonds). <b>Inter</b>molecular forces act <i>between</i> separate molecules and make them “stick.” The bonds <i>inside</i> a molecule decide its polarity, and polarity decides the IMFs <i>outside</i> it.</p>
<h3>Bonds or IMFs? Sort the substance first</h3>
<div class="tw"><table class="tb"><tr><th>Type</th><th>Particles</th><th>What holds it together</th><th>Typical state</th></tr>
<tr><td>Ionic</td><td>Cation + anion (metal + nonmetal)</td><td>Ionic bonds</td><td>Solid</td></tr>
<tr><td>Metallic</td><td>Metals only</td><td>Metallic bonds (electron sea)</td><td>Solid (Hg is a liquid)</td></tr>
<tr><td>Covalent network</td><td>Only C, or Si &amp; O, or B &amp; N (also SiC)</td><td>Covalent bonds throughout</td><td>Solid</td></tr>
<tr><td>Molecular: H-bonding</td><td>H bonded to F, O, N</td><td>IMFs</td><td>Often liquid</td></tr>
<tr><td>Molecular: polar</td><td>Polar molecules</td><td>IMFs (dipole–dipole)</td><td>Often liquid or gas</td></tr>
<tr><td>Molecular: nonpolar</td><td>Nonpolar molecules, noble gases</td><td>IMFs (LDF only)</td><td>Often gas</td></tr></table></div>
<div class="ex">Hg → metallic bonds (liquid). LiCl → ionic bonds (solid). H₂O → H-bonding IMFs (liquid). HCl → dipole–dipole IMFs (gas). Ne → LDF only (gas). BN → covalent network (solid).</div>
<h3>Why bonds are stronger: Coulomb's law</h3>
<div class="eqb">F ∝ q₁q₂ / r²</div>
<ul><li><b>q</b>: IMFs come from <i>partial</i> charges (permanent or induced dipoles), which are much smaller than the full charges or shared pairs in bonds.</li>
<li><b>r</b>: the distance between molecules is larger than the distance between bonded atoms.</li></ul>
<div class="ex">About <b>41 kJ</b> vaporizes 1 mol of water (overcoming IMFs), but about <b>938 kJ</b> breaks all the O–H bonds in 1 mol of water.</div>
<p>Drawing convention: <b>bonds = solid lines</b>, <b>IMFs = dashed/dotted lines</b>.</p>
<div class="tip">Boiling water does <i>not</i> make H₂ and O₂. The bubbles are H₂O(g). Phase changes break IMFs, never the covalent bonds inside molecules.</div>
<div class="cxs">${cx("3.2 · Types of solids","n32")}${cx("3.3 · States of matter","n33")}</div>`},

{id:"n31b",code:"3.1 · TYPES OF IMFs",t:"The IMF Family",h:`
<h3>Step-by-step: which IMFs are present?</h3>
<ol><li>Is it ionic, metallic, or a network solid? Then it's held by <b>bonds</b>, not IMFs.</li>
<li>Every molecule and atom has <b>London dispersion forces</b>.</li>
<li>Is the molecule <b>polar</b> (draw Lewis structure → VSEPR shape → do dipoles cancel)? Add <b>dipole–dipole</b>.</li>
<li>Is there an <b>H bonded directly to F, O, or N</b>? Add <b>hydrogen bonding</b>.</li>
<li>Is an <b>ion</b> mixed with a polar molecule (salt in water)? Add <b>ion–dipole</b>.</li></ol>
<div class="tw"><table class="tb"><tr><th>IMF</th><th>Between</th><th>Origin</th><th>Relative strength</th></tr>
<tr><td>London dispersion (LDF)</td><td>All molecules/atoms</td><td>Temporary, fluctuating dipoles that induce dipoles in neighbors</td><td>Weakest per contact, but grows with size; often the largest <i>net</i> force for big molecules</td></tr>
<tr><td>Dipole–induced dipole</td><td>Polar + nonpolar</td><td>Permanent dipole distorts a neighbor's cloud</td><td>Weak</td></tr>
<tr><td>Dipole–dipole</td><td>Polar + polar</td><td>δ⁺ end attracts δ⁻ end</td><td>Moderate (adds to LDF)</td></tr>
<tr><td>Hydrogen bond</td><td>H–F, H–O, H–N + lone pair on F/O/N</td><td>Very strong dipole; tiny H nearly exposed</td><td>Strong for an IMF, but still far weaker than a bond</td></tr>
<tr><td>Ion–dipole</td><td>Ion + polar molecule</td><td>Full charge attracts partial charge</td><td>Strongest IMF listed</td></tr></table></div>
<h3>London dispersion forces</h3>
<ul><li>Key word: <b>polarizability</b>. Electrons momentarily bunch up, making an instantaneous dipole that induces one next door.</li>
<li>The only IMF in nonpolar molecules (H₂, O₂, F₂, CO₂, CH₄) and noble gases (Ne, Ar). That's why small nonpolar molecules are usually <b>gases</b> at room temperature.</li></ul>
<h3>Dipole–dipole</h3>
<ul><li>Polar molecules line up so δ⁺ faces δ⁻ (attraction). δ⁺ facing δ⁺ is repulsion, but the net effect is attraction.</li>
<li>The larger the dipole moment, the stronger the force. H–Cl (ΔEN 0.9) beats H–Br (ΔEN 0.7).</li></ul>
<h3>Hydrogen bonding</h3>
<ul><li>Requires H bonded <i>directly</i> to <b>F, O, or N</b>, attracted to a lone pair on F/O/N of another molecule.</li>
<li>More H-bonding sites per molecule → stronger attractions (glycerol > ethylene glycol > ethanol).</li>
<li>A hydrogen bond is <b>not</b> a covalent bond. Covalent bond = shared electron pair inside a molecule. H-bond = electrostatic attraction between molecules.</li></ul>
<div class="tip">CH₂F₂ and CH₃F contain F, but their H atoms are bonded to C, so they <i>cannot</i> H-bond with each other (only dipole–dipole + LDF). HClO <i>can</i> H-bond: its H is on O (H–O–Cl).</div>
<div class="ex">Acetic acid (CH₃COOH) has LDF, dipole–dipole, and H-bonding. The O–H hydrogen of one molecule bonds to the C=O oxygen of another.</div>
<div class="cxs">${cx("3.1 · Strength factors","n31c")}${cx("3.1 · Ion–dipole & solubility","n31d")}</div>`},

{id:"n31c",code:"3.1 · STRENGTH & PROPERTIES",t:"Comparing IMF Strength",h:`
<h3>Stronger IMFs mean…</h3>
<div class="tw"><table class="tb"><tr><th>Property</th><th>Stronger IMFs</th><th>Why</th></tr>
<tr><td>Boiling point</td><td>Higher ↑</td><td>More energy needed to pull molecules apart</td></tr>
<tr><td>Melting point</td><td>Usually higher ↑</td><td>Packing also matters, so trends are messier</td></tr>
<tr><td>Vapor pressure</td><td>Lower ↓</td><td>Fewer molecules have enough KE to escape</td></tr>
<tr><td>Evaporation rate</td><td>Slower ↓</td><td>Same reason as vapor pressure</td></tr>
<tr><td>Enthalpy of vaporization/fusion</td><td>Larger ↑</td><td>More energy per mole to overcome attractions</td></tr></table></div>
<h3>Factors that change LDF strength</h3>
<ul><li><b>More electrons / bigger cloud</b> → more polarizable → stronger LDF. CH₄ &lt; C₂H₆; F₂ &lt; Cl₂ &lt; Br₂ &lt; I₂ (gas, gas, liquid, solid); He &lt; Ne &lt; Ar &lt; Xe.</li>
<li><b>Shape / contact area</b> (same formula): straight chains touch more than branched. n-pentane (bp 309 K) &gt; 2-methylbutane (301 K) &gt; 2,2-dimethylpropane (283 K).</li>
<li><b>Pi bonding</b> increases polarizability.</li></ul>
<h3>When size beats polarity</h3>
<p>Molecules with only LDF usually have the lowest boiling points, but not always. A huge nonpolar molecule can out-attract a small polar one.</p>
<div class="ex">Candle wax (C₂₅H₅₂, LDF only) is a solid, yet water (H-bonding + dipole + LDF) is a liquid. Wax has so many electrons (and so much contact area) that its total LDF outweighs water's H-bonds.</div>
<div class="ex">Cl₂ (bp 238 K, 34 e⁻, nonpolar) boils <i>higher</i> than HCl (188 K, 18 e⁻, polar). Cl₂'s larger, more polarizable cloud gives LDF strong enough to outweigh HCl's dipole–dipole.</div>
<div class="ex">CHBr₃ (bp 422 K) boils higher than CH₃OH (338 K) even though only methanol H-bonds. Bromoform's huge electron cloud gives very strong LDF.</div>
<h3>When H-bonding wins</h3>
<ul><li>HF (293 K) vs. F₂ (85 K): HF has H-bonding; F₂ has only weak LDF.</li>
<li>NH₃ (−28 °C) vs. PH₃ (−126 °C): NH₃ H-bonds; PH₃ only has dipole–dipole + LDF.</li>
<li>1-butanol (117 °C) vs. diethyl ether (35 °C): same formula C₄H₁₀O and electrons, but only butanol has an O–H to H-bond.</li>
<li>H₂S vs. H₂O: H₂S has <i>stronger</i> LDF (more electrons), but H₂O has stronger dipole–dipole (O is more electronegative) <i>and</i> H-bonding, so water boils far higher.</li></ul>
<div class="jt">Name the IMFs in <i>both</i> substances → state which is stronger and the structural reason (electrons/polarizability, polarity, H on F/O/N) → connect to energy: “more energy is required to overcome the stronger attractions, so ___ has the higher boiling point / lower vapor pressure.”</div>
<div class="tip">Never say “bonds break” when a molecular substance boils. Say the <b>intermolecular forces</b> between molecules are overcome.</div>
<div class="cxs">${cx("3.6 · Strong IMFs → non-ideal gases","n36")}</div>`},

{id:"n31d",code:"3.1 · ION–DIPOLE & SOLUBILITY",t:"Ion–Dipole Forces & “Like Dissolves Like”",h:`
<h3>Ion–dipole</h3>
<ul><li>An ion attracts the oppositely charged end of polar molecules (usually water).</li>
<li><b>Cations</b> (Na⁺, Mg²⁺) attract water's δ⁻ <b>oxygen</b>. <b>Anions</b> (F⁻, Cl⁻) attract water's δ⁺ <b>hydrogens</b>.</li>
<li>Attraction <b>increases</b> as ion charge increases and as ion <b>size decreases</b> (Coulomb's law). Among Na⁺, K⁺, Mg²⁺, Ca²⁺, <b>Mg²⁺</b> attracts water most strongly.</li></ul>
<div class="tip">On particle diagrams, look at which atom of each water points at the ion. O pointing in → the ion is a cation. H pointing in → the ion is an anion.</div>
<h3>Solubility: like dissolves like</h3>
<div class="tw"><table class="tb"><tr><th>Solute</th><th>Water (polar)</th><th>CCl₄ (nonpolar)</th><th>Ethanol (both)</th></tr>
<tr><td>NaCl, KNO₃ (ionic)</td><td>✔ soluble</td><td>✘</td><td>✘ (alcohols don't dissolve ionic solids well)</td></tr>
<tr><td>I₂, Br₂, C₆H₆ (nonpolar)</td><td>✘</td><td>✔</td><td>✔</td></tr></table></div>
<div class="ex">Pyridine (C₅H₅N) dissolves in water but benzene (C₆H₆) doesn't. Pyridine's N makes it polar and gives a lone pair that accepts H-bonds from water. Benzene is nonpolar with only LDF, which can't compete with water's H-bonds.</div>
<div class="ex">Glucose (C₆H₁₂O₆) has five O–H groups, so it H-bonds with water and dissolves. Cyclohexane (C₆H₁₂) has only LDF, so it doesn't.</div>
<div class="cxs">${cx("Preview · 3.7–3.10 solutions","n37")}</div>`},

{id:"n32",code:"3.2 · PROPERTIES OF SOLIDS",t:"Four Types of Solids",h:`
<div class="tw"><table class="tb"><tr><th>Solid</th><th>Particles</th><th>Held by</th><th>Melting point</th><th>Conducts?</th><th>Mechanical</th><th>Water solubility</th><th>Examples</th></tr>
<tr><td>Ionic</td><td>Cations + anions</td><td>Ionic bonds</td><td>High</td><td>Only molten or dissolved</td><td>Hard, brittle</td><td>Often soluble</td><td>NaCl, MgO, Na₂SO₄, NaOH</td></tr>
<tr><td>Metallic</td><td>Cations in e⁻ sea</td><td>Metallic bonds</td><td>Wide range (Hg liquid, W very high)</td><td>Yes, as solid</td><td>Malleable, ductile, lustrous</td><td>Insoluble</td><td>Cu, Al, Rh, brass</td></tr>
<tr><td>Covalent network</td><td>Nonmetal atoms</td><td>Covalent bonds in a continuous network</td><td>Very high</td><td>No (graphite is the exception)</td><td>Very hard, brittle</td><td>Insoluble</td><td>Diamond, SiO₂, SiC, BN</td></tr>
<tr><td>Molecular</td><td>Discrete molecules</td><td>IMFs</td><td>Low</td><td>No</td><td>Soft</td><td>Polar: often yes. Nonpolar: no</td><td>Ice, I₂, CO₂(s), C₆H₄Cl₂, glucose</td></tr></table></div>
<h3>Ionic solids</h3>
<ul><li>Strong Coulombic attractions → low vapor pressure, high MP and BP.</li>
<li><b>Brittle</b>: shifting a layer lines up like charges, which repel, and the crystal cleaves.</li>
<li>Conduct only when ions are <b>mobile</b> (melted or dissolved). Electrons don't move in ionic solids.</li>
<li>Larger charges and smaller ions → stronger attraction → higher MP. <b>MgO</b> (2+/2−, ≈2852 °C) ≫ <b>NaCl</b> (1+/1−, 801 °C). <b>LiF</b> (870 °C) &gt; <b>CsI</b> (621 °C) because Li⁺ and F⁻ are smaller.</li></ul>
<h3>Covalent network solids</h3>
<ul><li>Only nonmetals: elemental (diamond, graphite, Si) or binary nonmetal compounds (SiO₂, SiC, BN).</li>
<li>No discrete molecules. “SiO₂” is a ratio, not a molecule.</li>
<li><b>Diamond</b>: rigid 3-D network with fixed bond angles → extremely hard. <b>Graphite</b>: 2-D layers that slide → soft; delocalized electrons → conducts.</li>
<li>Melting means breaking covalent bonds, so MPs are very high.</li></ul>
<h3>Molecular solids</h3>
<ul><li>Covalent bonds <i>inside</i> molecules, weak IMFs <i>between</i> them → low MP; some sublime (dry ice, I₂).</li>
<li>Don't conduct: valence electrons are <b>localized</b> in bonds and lone pairs.</li>
<li>Can be very large molecules or polymers (plastics, wax).</li></ul>
<h3>Metallic solids &amp; alloys</h3>
<ul><li>Delocalized valence electrons → conduct heat and electricity; cations shift without breaking the electron sea → malleable and ductile.</li>
<li><b>Substitutional alloy</b> (brass: Zn replaces Cu, similar size). <b>Interstitial alloy</b> (steel: small C fills gaps in Fe) → more rigid, less malleable and ductile. Both still conduct.</li></ul>
<div class="tip">To prove a solid is ionic, test the <b>aqueous solution</b> (or melt) for conductivity. A solid ionic crystal and a molecular crystal both fail to conduct.</div>
<div class="ex">Overall MP order (from the POGIL data): molecular &lt; metallic (typically) &lt; ionic &lt; network. There's overlap, e.g., platinum (metallic) melts higher than some network solids.</div>
<div class="cxs">${cx("3.3 · Crystalline vs. amorphous","n33")}</div>`},

{id:"n33",code:"3.3 · SOLIDS, LIQUIDS, GASES",t:"States of Matter at the Particle Level",h:`
<div class="tw"><table class="tb"><tr><th>State</th><th>Spacing</th><th>Motion</th><th>Shape / volume</th></tr>
<tr><td>Solid</td><td>Close contact, fixed positions</td><td>Vibrate in place, no translation</td><td>Definite shape and volume</td></tr>
<tr><td>Liquid</td><td>Close contact</td><td>Move past and collide continually</td><td>Definite volume, takes container's shape</td></tr>
<tr><td>Gas</td><td>Far apart, mostly empty space</td><td>Fast, random, straight lines</td><td>Fills container: no definite shape or volume</td></tr></table></div>
<ul><li><b>Crystalline</b> solids have a regular 3-D pattern (sharp MP). <b>Amorphous</b> solids (glass, plastic) have no long-range order.</li>
<li>Solid and liquid have <b>similar molar volumes</b> because particles touch in both. A gas's molar volume is about 1000× larger.</li>
<li>Liquid behavior depends on IMF strength (polarity, H-bonding) and temperature.</li></ul>
<h3>Drawing particle diagrams</h3>
<ul><li><b>Solid</b>: tightly packed, ordered rows, tiny vibration marks.</li>
<li><b>Liquid</b>: still touching but disordered, with gaps, moderate “whooshes.”</li>
<li><b>Gas</b>: few particles spread far apart, long motion lines (most KE).</li>
<li>Keep the <b>same number of particles</b> when showing a phase change, and never break molecules apart for a physical change.</li></ul>
<div class="ex">Xe(s), Xe(l), Xe(g): Xe has only LDF. Its neighbor I₂ is a solid at room temperature because I₂ has more electrons (106 vs. 54), so it is more polarizable with stronger LDF.</div>`},

{id:"n34",code:"3.4 · IDEAL GAS LAW",t:"Gas Variables & Gas Laws",h:`
<h3>Variables and units</h3>
<div class="tw"><table class="tb"><tr><th>Variable</th><th>Symbol</th><th>Units</th><th>Conversions (reference sheet)</th></tr>
<tr><td>Pressure</td><td>P</td><td>atm, mmHg, torr, kPa</td><td>1 atm = 760 mmHg = 760 torr = 101.3 kPa</td></tr>
<tr><td>Volume</td><td>V</td><td>L (for PV = nRT)</td><td>1 L = 1000 mL; 1 mL = 1 cm³</td></tr>
<tr><td>Temperature</td><td>T</td><td><b>K only</b></td><td>K = °C + 273.15</td></tr>
<tr><td>Amount</td><td>n</td><td>mol</td><td>n = m / M</td></tr></table></div>
<p><b>STP</b> = 273.15 K and 1.0 atm. At STP, one mole of <i>any</i> ideal gas occupies <b>22.4 L</b>. “Rigid container” means V is constant.</p>
<h3>Ideal gas law: one set of conditions</h3>
<div class="eqb">PV = nRT &nbsp;&nbsp; R = 0.08206 L·atm/(mol·K) &nbsp;|&nbsp; 8.314 L·kPa/(mol·K)</div>
<ul><li>Use when conditions <b>aren't changing</b> (no “initial” and “final”).</li>
<li>Match R to your pressure unit, and convert mL → L and °C → K first.</li>
<li>Derived forms (not on the reference sheet): <span class="eq">PV = (m/M)RT</span> and <span class="eq">M = DRT/P</span>.</li></ul>
<h3>Combined gas law: conditions change</h3>
<div class="eqb">P₁V₁ / (n₁T₁) = P₂V₂ / (n₂T₂)</div>
<p>Cross out whatever stays constant to get the individual laws:</p>
<div class="tw"><table class="tb"><tr><th>Law</th><th>Changing</th><th>Constant</th><th>Relationship</th><th>Formula</th><th>Lab demo</th></tr>
<tr><td>Boyle's</td><td>P, V</td><td>n, T</td><td>Inverse</td><td>P₁V₁ = P₂V₂</td><td>Marshmallow in syringe</td></tr>
<tr><td>Charles's</td><td>V, T</td><td>n, P</td><td>Direct</td><td>V₁/T₁ = V₂/T₂</td><td>Balloon on heated flask</td></tr>
<tr><td>Gay-Lussac's</td><td>P, T</td><td>n, V</td><td>Direct</td><td>P₁/T₁ = P₂/T₂</td><td>Can crush in ice bath</td></tr>
<tr><td>Avogadro's</td><td>V, n</td><td>P, T</td><td>Direct</td><td>V₁/n₁ = V₂/n₂</td><td>Birthday candles</td></tr></table></div>
<h3>Graphs</h3>
<ul><li>V vs. T(K), P vs. T(K), V vs. n: straight lines through the origin (direct).</li>
<li>P vs. V: a curve that falls (inverse). P vs. 1/V is a straight line.</li></ul>
<div class="ex">Balloon: 1.05 atm, 5.0 L, 20 °C → 0.65 atm, −15 °C. V₂ = (5.0)(1.05/0.65)(258.15/293.15) = <b>7.1 L</b>.</div>
<div class="tip">Doubling °C does <i>not</i> double the volume. Going from 100 °C to 200 °C is 373 K → 473 K, only ×1.27.</div>
<div class="cxs">${cx("3.5 · KMT explains these laws","n35")}${cx("Labs","nlab")}</div>`},

{id:"n34b",code:"3.4 · DALTON'S LAW",t:"Mixtures of Gases",h:`
<p>Non-reacting gases in a mixture each behave as if alone. Each exerts its own <b>partial pressure</b>, and the total depends only on the <b>total number of moles</b> hitting the walls, not their identities.</p>
<div class="eqb">P_total = P_A + P_B + P_C + …</div>
<div class="eqb">P_A = X_A · P_total &nbsp;&nbsp; X_A = n_A / n_total</div>
<div class="ex">Air at 1 atm: 78% N₂, 21% O₂, 0.9% Ar → P(N₂) = 0.78 atm, P(O₂) = 0.21 atm, P(Ar) = 0.009 atm.</div>
<div class="ex">N₂/O₂/Ne mixture at 839 torr with X = 0.41, 0.35, 0.24 → 344 torr, 294 torr, 201 torr.</div>
<div class="ex">Two flasks: 4.0 L Ne at 3.6 atm and 8.0 L Ar at 2.4 atm mixed into 12.0 L (same T). P(Ne) = 3.6·4.0/12.0 = 1.2 atm; P(Ar) = 2.4·8.0/12.0 = 1.6 atm; total = <b>2.8 atm</b>.</div>
<div class="tip">Equal <i>masses</i> ≠ equal moles. In an equal-mass mixture, the lightest gas has the highest partial pressure.</div>
<div class="tip">Adding more Ar to a rigid container raises P(Ar) and P_total, but P(N₂) doesn't change (its moles, V, and T didn't change).</div>
<h3>Collecting gas over water</h3>
<div class="eqb">P_gas = P_barometric − P_H₂O(T)</div>
<p>The vapor pressure of water depends only on temperature (≈19.8 mmHg at 22 °C).</p>
<div class="cxs">${cx("Cage of Death lab","nlab")}</div>`},

{id:"n35",code:"3.5 · KINETIC MOLECULAR THEORY",t:"KMT & Maxwell–Boltzmann",h:`
<h3>The five postulates</h3>
<ol><li>Gas particles are in <b>constant, random motion</b> and collide with each other and the container.</li>
<li>A gas is <b>mostly empty space</b>: particles are tiny and far apart (volume negligible). This is why gases compress easily.</li>
<li><b>Pressure</b> comes from particles hitting the container walls. Collisions transfer momentum; particles are tiny but numerous.</li>
<li>Particles have <b>no attractions</b> (no IMFs) and collisions are <b>elastic</b>.</li>
<li>Average <b>kinetic energy ∝ Kelvin temperature</b>.</li></ol>
<div class="eqb">KE = ½mv² &nbsp;&nbsp; T ∝ KE_avg</div>
<ul><li>Same T → same average KE for every gas. Since KE = ½mv², the <b>lighter gas moves faster</b>. H₂ is fastest; C₈H₁₈ is slowest.</li>
<li>Heating a gas → faster particles → <b>more frequent and more forceful</b> wall collisions → higher pressure (rigid container) or larger volume (flexible).</li>
<li>Compressing at constant T → <b>same speed</b>, but particles hit walls more often in the smaller space → higher pressure.</li></ul>
<h3>Maxwell–Boltzmann distributions</h3>
<ul><li>Not every particle has the same speed; the curve shows the spread.</li>
<li><b>Higher T</b>: peak shifts right and gets lower and wider. Area under the curve is the same (same number of particles).</li>
<li><b>Heavier gas (same T)</b>: taller, narrower peak at lower speed. <b>Lighter gas</b>: flatter, spread to higher speeds.</li></ul>
<div class="ex">He vs. O₂ at 300 K: O₂ is the tall, narrow curve at low speed; He is the flat, wide curve. Their average KEs are <b>equal</b> because T is equal.</div>
<div class="tip">If a question asks about kinetic <i>energy</i>, the answer depends only on T. If it asks about <i>speed</i>, mass matters too.</div>
<div class="cxs"><a class="cx" onclick="setMode('gas')"><i class="fa-solid fa-wind"></i>Try the Gas Lab simulator</a>${cx("3.6 · When KMT fails","n36")}</div>`},

{id:"n36",code:"3.6 · DEVIATION FROM IDEAL",t:"Real Gases",h:`
<div class="tw"><table class="tb"><tr><th></th><th>Ideal gas</th><th>Real (non-ideal) gas</th></tr>
<tr><td>Assumes</td><td>Fast particles, far apart, no IMFs, elastic collisions</td><td>Particles have volume and attract each other</td></tr>
<tr><td>Conditions</td><td><b>High T, low P</b></td><td><b>Low T, high P</b> (close to condensing)</td></tr></table></div>
<h3>Two causes of deviation</h3>
<div class="tw"><table class="tb"><tr><th>Cause</th><th>When it dominates</th><th>Effect vs. PV = nRT</th></tr>
<tr><td>Attractions (IMFs)</td><td>Low T, moderate–high P, polar or large molecules</td><td>Particles pull on each other and hit walls less often and less hard → <b>P (or V) lower</b> than predicted</td></tr>
<tr><td>Particle volume</td><td>Extremely high P</td><td>Less empty space to move in → <b>V (or P) higher</b> than predicted</td></tr></table></div>
<div class="ex">Rn at 10 atm and 100 K: a smaller volume than predicted means IMFs pulled particles together. A larger volume than predicted means the Rn atoms' own volume isn't negligible.</div>
<div class="ex">H₂ in 5.0 L with 12.0 mol at 300 K: PV = nRT predicts 59 atm, but 62 atm is observed. The observed P is higher because the particles' combined volume is too large to ignore (less free space). The 3.0 mol / 15.0 L sample (predicted 4.9 atm, observed 4.9 atm) behaves ideally.</div>
<div class="ex">NO₂ vs. CO₂ (similar mass): NO₂ is polar (bent, odd electron) and has dipole–dipole forces, so it deviates more.</div>
<div class="tip">“Real gas pressure is lower” → explain with attractions. “Real gas pressure/volume is higher” → explain with particle volume. Match the explanation to the direction.</div>`},

{id:"nlab",code:"LABS · YOUR CLASS EXPERIMENTS",t:"Gas Labs & Lab Math",h:`
<h3>Gizmo: Gas Variables &amp; Ideal Gas Law</h3>
<ul><li>Double T → V doubles (P, n constant). Double P → V halves. Double n → V doubles. Double T → P doubles (V constant). Double V → P halves.</li>
<li>Combine V ∝ n, V ∝ T, V ∝ 1/P → V ∝ nT/P → V = nRT/P → <b>PV = nRT</b>.</li>
<li>At STP, any gas gives 22.4 L/mol. Changing the gas identity changes the speed, not the volume.</li></ul>
<h3>Gas Behavior stations</h3>
<ul><li><b>Marshmallow (Boyle)</b>: pull plunger → V ↑, P ↓ → marshmallow puffs up.</li>
<li><b>Birthday candles (Avogadro)</b>: candles use up O₂, fewer gas moles → smaller gas volume → water rises into the jar.</li>
<li><b>Can crush (Gay-Lussac)</b>: hot vapor cooled in ice → P inside drops below atmospheric P → can crushes.</li>
<li><b>Balloon on flask (Charles)</b>: heat → V ↑; ice bath → V ↓.</li></ul>
<h3>Summative: Cage of Death (molar volume of H₂)</h3>
<div class="eqb">Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g)</div>
<ol><li>Convert T to K (water temp = gas temp at thermal equilibrium).</li>
<li>Dalton: P(H₂) = P_barometric − P(H₂O). Convert to atm (if given inHg: 1 in = 2.54 cm = 25.4 mm).</li>
<li>Ideal gas law → moles of H₂ (V in L).</li>
<li>Combined gas law → volume at STP (n constant).</li>
<li>Molar volume = V_STP ÷ n. Compare with 22.4 L/mol for % error.</li>
<li>Theoretical n(H₂) = n(Mg), with mass from ribbon length (1 m Mg = 0.921 g).</li></ol>
<div class="ex">Pre-lab: 31.0 mL H₂ at 22 °C, 746 mmHg, P(H₂O) = 19.8 mmHg. P(H₂) = 726.2 mmHg = 0.9555 atm. n = (0.9555)(0.0310)/[(0.08206)(295.15)] = 1.22 × 10⁻³ mol. V_STP = 31.0 mL × (0.9555/1)(273.15/295.15) = 27.4 mL.</div>
<div class="tip">Common error explanations: unreacted Mg or H₂ bubbles stuck to the tube (less gas → smaller measured V); forgetting to subtract water vapor (P too high → n too high); water levels not equalized (gas P ≠ barometric P).</div>
<h3>Molar mass of an unknown gas (practice set #31)</h3>
<div class="ex">0.843 L flask at 23.0 °C, 750. torr. Air mass = 1.18 g/L × 0.843 L = 0.99 g. Empty flask = 157.70 − 0.99 = 156.71 g. Gas = 158.08 − 156.71 = 1.37 g. n = (0.987 atm)(0.843 L)/[(0.08206)(296.15 K)] = <b>0.0342 mol</b>. M = 1.37 / 0.0342 = <b>40.0 g/mol</b>; % error vs. CO₂ = 8.9%.</div>
<div class="tip">The answer key writes n = 0.342 mol. That's a typo: it's 0.0342 mol. The final molar mass (40.0 g/mol) is correct.</div>
<p>Error analysis: leftover air (lighter than CO₂) → lower mass of gas → <b>low</b> molar mass. CO₂ colder than reported → denser gas, more mass in the flask → <b>high</b> molar mass.</p>`},

{id:"n37",code:"3.7–3.13 · PREVIEW",t:"Coming Up: Solutions & Spectroscopy",h:`
<p class="mu">These objectives are on your unit list but not in this packet of handouts. Here's the core so the terms aren't new when you get there.</p>
<ul><li><b>3.7 Solutions</b>: homogeneous mixtures (solid, liquid, or gas). <span class="eq">M = mol solute / L solution</span></li>
<li><b>3.8 Particle models</b>: show relative amounts of solute and solvent and the IMFs between them (e.g., water's O facing Na⁺).</li>
<li><b>3.9 Separation</b>: filtration can't separate a solution. <b>Chromatography</b> separates by different attractions to the mobile vs. stationary phase. <b>Distillation</b> separates by different vapor pressures (IMFs).</li>
<li><b>3.10 Solubility</b>: similar IMFs → soluble or miscible.</li>
<li><b>3.11 Spectroscopy</b>: microwave → rotation; infrared → vibration; UV/visible → electronic transitions.</li>
<li><b>3.12 Photons</b>: <span class="eq">c = λν</span>, <span class="eq">E = hν</span>. An absorbed photon raises the energy by exactly E.</li>
<li><b>3.13 Beer–Lambert</b>: <span class="eq">A = εbc</span>. With b and λ fixed, absorbance ∝ concentration.</li></ul>`}
];

function imfQ(){
  const m=MOLS[mOrder[mi%mOrder.length]];

}

  $("ans").disabled=true;document.querySelectorAll("#main .row button").forEach(b=>b.disabled=true);
  if(exact||close){sc++;$("f").innerHTML=`<div class="card ok">${close?"Close enough (check the spelling): ":"Correct! "}<b>${d[0]}</b></div><button class="on" onclick="i++;typ()">Next</button>`}
  else{addMiss(k);bar();$("f").innerHTML=`<div class="card bad">The term is <b>${d[0]}</b>.</div><button class="on" onclick="i++;typ()">Next</button>`}
}
